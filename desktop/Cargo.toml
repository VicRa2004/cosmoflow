[package]
name = "cosmoflow"
# `pnpm version:bump` la mantiene igual que la del package.json raíz.
version = "0.7.1"
edition = "2024"
publish = false

[dependencies]
getrandom = "=0.4.3"
gpui-kit = "=0.11.0"
jiff = "=1.0.3"
keyring = { version = "=4.2.0" }
open = "=5.4.5"
sentry = { version = "=0.49.6", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ureq = { version = "=3.5.2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
