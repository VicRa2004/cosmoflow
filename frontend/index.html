<!doctype html>
<html lang="es" class="h-full">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#fcfcfe" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0e1018" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-title" content="Cosmoflow" />
		<title>Cosmoflow</title>
		<script>
			// Antes de pintar, para no parpadear: misma lógica que src/core/tema.ts.
			(() => {
				let tema = null;
				try {
					tema = localStorage.getItem("tema");
				} catch {}
				const oscuro =
					tema === "oscuro" ||
					(tema !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.dataset.tema = oscuro ? "oscuro" : "claro";
			})();
		</script>
	</head>
	<body class="h-full antialiased">
		<div id="root" class="h-full flex flex-col"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
