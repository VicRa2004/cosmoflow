name: Desktop

# En push a main o PR sobre desktop/** ejecuta fmt, clippy y tests.
# En tags v* (o workflow_dispatch) compila y empaqueta para Linux, macOS y Windows;
# en tags v* adjunta todos los instaladores al Release de GitHub.
# `paths` no se evalúa en los tags: un tag v* siempre empaqueta.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - name: Instalar dependencias de sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang pkg-config \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  version:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validar.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Validar versión (tag = package.json = desktop/Cargo.toml)
        id: validar
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(awk '
            /^\[package\]/ { en_paquete = 1; next }
            /^\[/ { en_paquete = 0 }
            en_paquete && /^version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"|".*/, "")
              print
              exit
            }
          ' desktop/Cargo.toml)
          [ "$VERSION" = "$CARGO_VERSION" ] || {
            echo "package.json ($VERSION) ≠ desktop/Cargo.toml ($CARGO_VERSION)"
            exit 1
          }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$CARGO_VERSION" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con desktop/Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

  empaquetar:
    needs: [check, version]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            nombre: linux-x64
          - os: macos-15
            nombre: macos-arm64
          - os: windows-2022
            nombre: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Instalar dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ clang pkg-config \
            libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Compilar y empaquetar
        shell: bash
        # DSN de GlitchTip embebido al compilar; sin el secret, la app no envía errores.
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_DESKTOP }}
        run: bash desktop/scripts/empaquetar.sh
      - uses: actions/upload-artifact@v5
        with:
          name: cosmoflow-${{ needs.version.outputs.version }}-${{ matrix.nombre }}
          path: desktop/dist/*

  release:
    needs: [version, empaquetar]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artefactos
          merge-multiple: true
      - name: Release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*
          generate_release_notes: true
